# XMJD6 常用功能集中配置
# 修改后需要重新部署。true=开启，false=关闭。
patch:
  # ===== 方案显示与基础输入 =====
  schema/name: 🌟🐈       # 方案名称
  schema/icon: xmjd6.ico  # 方案图标，部署与状态栏显示
  speller/auto_select: false          # 自动上屏；默认关闭
  hint_text: ''                     # 顶功提示符

  # ===== 逐码提示与候选数量 =====
  translator/enable_completion: true  # 主词库逐码候选；关闭后键道提示 Lua 也会受影响
  menu/page_size: 5                   # 每页候选数量
  for_hint/max_hint_candidates: 50    # 追加简码提示的候选上限；0 表示不限
  for_hint/max_completion_candidates: 30  # 逐码 completion 候选上限
  embeded_cands/max_candidates: 50    # 输入框内嵌候选上限；0 表示不限

  # ===== 功能总开关 =====
  single_char_first/enabled: true           # 同码单字优先（兜底默认值，见下方 switches/@1）；运行时以开关为准
  candidate_order/enabled: true             # 动态调频；false 时按 0 不调频
  quick_symbol/enabled: true                # 快捷符号
  direct_ascii/symbols: ".,:!?"             # 空码直接上屏；避免加入 ; ' / = \
  direct_ascii/digits: true                 # 空码数字直接上屏
  text_transform/hotkey: "Control+g"        # 当前候选进入文本加工面板
  text_transform/sentence_hotkey: "slash"   # 有候选时按 / 加工当前内容
  text_transform/sentence_prefix: "a"       # 整句模式前缀（与 sentence_mode/prefix 同步）

  # ===== 追顶（顶功）总开关 =====
  # ★【关掉追顶】= 把下面这一行整行注释掉（行首加 #）。
  # ★【开启追顶】= 保留下面这一行（值为 true）。
  # 关闭后的效果 = 完整没有追顶功能：
  #   · 经典顶功停（如 dia+o 不再顶出「当中」）
  #   · 空码回退停（如 lks+m 不再顶出「劳科所」）
  #   · ; ' 只作为普通分隔符，走流式输入
  # ⚠ 本键的默认值【故意不写进 xmjd6.schema.yaml】，只在这里给。
  #   原因：schema 一旦写了默认值，注释掉这行就会回落到默认值 → 「注释关不掉」。
  # ⚠ 另外，启用流式输入（本文件末尾 translator/enable_sentence: true）也会强制关闭追顶。
  topup/enabled: true

  # ===== 追顶强度（仅在追顶总开关为开时有意义）=====
  # true  = 任意字母键追加后无候选也回退上屏（更激进：lks+m 会顶出「劳科所」）
  # false = 只顶「顶功键连续」场景（当前效果：dia+o 顶出「当中」，lks+m 不顶）
  # direct_ascii/empty_code_topup: false

  # ===== 同码单字优先微调 =====
  # 效果：候选框里单字浮到多字词前面，如 ds → 大 妲 打 瘩 答 达 …
  # 原理：稳定分区（只调次序、不改权重），不影响调频、完整度与性能。
  single_char_first/min_candidates: 4       # 候选数达到该值才重排；候选少时原样输出
  single_char_first/keep_phrases: 1         # 置顶保留前 N 个不动；1=首选永远留在原位
  single_char_first/max_scan: 0             # 最多处理多少候选；0 表示不限

  # ===== 各状态开关的默认值 =====
  # 注意：switches/@N 的 N 是 0 起始下标，即 @0 对应 xmjd6.schema.yaml 中 switches 列表的第一个开关。
  # ❗ 该映射与 schema 里 switches 的【声明顺序】严格对应，顺序一变必须同步改这里，否则默认值全部错位！
  # 当前对应关系（2026-09-20 调整：single_char_first 前移到第 2 位，以便在 Ctrl+` 菜单里靠前显示）：
  #   @0 ascii_mode   @1 single_char_first
  #   @2 full_shape   @3 jffh         @4 mars      @5 tofu
  #   @6 ascii_punct  @7 emoji_cn     @8 wxw_hint  @9 completion
  #   @10 candidate_order_enabled     @11 quick_symbol_enabled
  #   @12 embeded_cands               @13 eng_space  @14 sentence_mode_enabled
  #   @15 punct_direct_enabled        @16 equal_direct_enabled
  # 1=默认开启，0=默认关闭。
  switches/@1/reset: 0                # 单字优先；1=开，0=关
  switches/@7/reset: 1                # Emoji
  switches/@8/reset: 1                # 630 简码提示
  switches/@9/reset: 1                # 逐码候选
  switches/@11/reset: 1               # 快符开关；1=开（候选模式），0=关（空码时直接上屏有输入时作次选键上屏第2个候选）
  switches/@12/reset: 0               # 输入框内嵌候选；0=关，1=开
  switches/@15/reset: 1               # 符号\$*/这些会直接上屏；1=开（候选模式），0=关（直接上屏）；& 已独立，不受此开关控制
  switches/@16/reset: 1               # 等号直接上屏；1=开（候选模式），0=关（直接上屏）
  # switches/@10/reset: 1           # 动态调频
  # switches/@13/reset: 1           # 英文自动加空格
  # switches/@14/reset: 1           # 连打模式（a 前缀）；连打内部的自动分段由它单独控制，与「追顶总开关」无关

  # ===== 重复上屏记忆数量 =====
  repeat_history/size: 5              # 输入 i 时显示最近多少条
  repeat_history2/size: 6             # 输入 ;f 时显示最近多少条

  # ===== 连打模式前缀键 =====
  # 空码时按下此键进入整句连打模式。
  # 注意：整句内部分隔符始终为 '，不可更改。
  # 更改前缀键后需同步修改 recognizer/patterns/sentence_mode 正则。
  sentence_mode/prefix: "a"           # 连打模式前缀键（默认 '）
  recognizer/patterns/sentence_mode: "^a[a-z']+"  # 与 sentence_mode/prefix 同步；单独 a 留给主词库翻译

  # ===== 顶功保护词库 =====
  topup/protected_dicts:
    - xmjd6.zidingyi

  # ===== 流式输入配置（默认关闭） =====
  # 如需启用流式输入，请取消下面两行注释。
  # 启用 enable_sentence 后，追顶会自动禁用（经典顶功 + 空码回退一起停），; ' 号只作为分隔符使用。
  # 与上方「追顶总开关 topup/enabled」是「或」的关系：任一为关即无追顶。
  # translator/enable_sentence: true   # 启用整句输入（同时自动禁用追顶）
  # translator/enable_user_dict: true  # 启用用户词典（流式输入需要）
